name: conformance

# Proves ofxOrtho produces byte-identical output to the JavaScript reference
# for the same seed and dials. Runs on plain cc/c++ with no openFrameworks:
# building GLFW proves nothing about language conformance.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out ofxOrtho
        uses: actions/checkout@v4
        with:
          path: ofxOrtho

      # The harness diffs against the reference repo's golden vectors and
      # expects it as a sibling directory.
      - name: Check out the ortho reference
        uses: actions/checkout@v4
        with:
          repository: leeMeredith/ortho
          path: ortho

      # The kernel is vendored, not a submodule — this guards against a
      # bad vendor update silently emptying the directory.
      - name: Verify the vendored kernel is present
        working-directory: ofxOrtho
        run: test -f libs/ortho-kernel/src/ortho.c

      - name: Run conformance
        working-directory: ofxOrtho
        run: ./tests/conformance.sh ../ortho